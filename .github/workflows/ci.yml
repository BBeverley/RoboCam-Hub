name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GSTREAMER_VERSION: 1.28.6

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS arm64
            os: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Install pinned GStreamer SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gstreamer-$env:GSTREAMER_VERSION.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "gstreamer"
          $uri = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer

          $expectedHash = "059251444d1267b486eba390b18d25fed87e10315e72f757ec6c7e912fa746b5"
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "GStreamer installer checksum mismatch: $actualHash"
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/NORESTART",
            "/CURRENTUSER",
            "/TYPE=devel",
            "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GStreamer installer failed with exit code $($process.ExitCode)"
          }

          "GSTREAMER_ROOT_X86_64=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$installRoot\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GST_PLUGIN_SYSTEM_PATH_1_0=$installRoot\lib\gstreamer-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$installRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install pinned GStreamer SDK on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runtime_pkg="$RUNNER_TEMP/gstreamer-runtime.pkg"
          devel_pkg="$RUNNER_TEMP/gstreamer-devel.pkg"
          base_uri="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          curl --fail --location --retry 3 "$base_uri/gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" --output "$runtime_pkg"
          curl --fail --location --retry 3 "$base_uri/gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" --output "$devel_pkg"

          echo "a8eb366c59b7e9e5dc049848fed6bcd203a8878aa7517c051639fda78797c6ad  $runtime_pkg" | shasum --algorithm 256 --check
          echo "177b1428d0f47b844e7bff2aeeb22047686d802eba21580dab52f4a6fe1dcf02  $devel_pkg" | shasum --algorithm 256 --check
          sudo installer -pkg "$runtime_pkg" -target /
          sudo installer -pkg "$devel_pkg" -target /

          gst_root="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          echo "$gst_root/bin" >> "$GITHUB_PATH"
          echo "$gst_root/Commands" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$gst_root/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$gst_root/lib" >> "$GITHUB_ENV"
          echo "GST_PLUGIN_SYSTEM_PATH_1_0=$gst_root/lib/gstreamer-1.0" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          dotnet --info
          cmake --version
          pkg-config --modversion gstreamer-1.0 gstreamer-app-1.0
          gst-inspect-1.0 avdec_h264

      - name: Configure native CMake project
        run: cmake -S native -B native/build-ci -DBUILD_TESTING=ON

      - name: Build native library and tests
        run: cmake --build native/build-ci --config Release --parallel

      - name: Run native CTest suite
        run: ctest --test-dir native/build-ci --build-config Release --output-on-failure

      - name: Restore managed solution
        run: dotnet restore RoboCamHub.slnx

      - name: Build managed solution and stage native ABI library
        run: dotnet build RoboCamHub.slnx --configuration Release --no-restore --warnaserror

      - name: Run managed unit tests
        run: dotnet test tests/managed/RoboCamHub.Domain.Tests/RoboCamHub.Domain.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run managed/native ABI integration tests
        run: dotnet test tests/managed/RoboCamHub.NativeInterop.Tests/RoboCamHub.NativeInterop.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run managed runtime/application integration tests
        run: dotnet test tests/managed/RoboCamHub.Runtime.Tests/RoboCamHub.Runtime.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run managed Avalonia workspace/application tests
        run: dotnet test tests/managed/RoboCamHub.Application.Tests/RoboCamHub.Application.Tests.csproj --configuration Release --no-build --no-restore
